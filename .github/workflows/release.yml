name: Build & Release

# 触发规则：
#  * push main / pull_request：仅执行编译检查、单元测试与产物构建，不发布 Release；
#  * push tag (v*)：严格校验语义化版本，编译、生成构建溯源证明 (Attestation) 并发布 GitHub Release；
#  * workflow_dispatch：支持手动触发运行。
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # 创建 Release 并上传附件
  id-token: write        # OIDC：生成构建溯源签名
  attestations: write    # 写入 Artifact Attestations

jobs:
  # ---------------------------------------------------------------- 触发校验
  validate:
    name: Validate trigger
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check branch / tag
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            # Tag 触发：必须是严格语义化版本 (例如 v0.1.0 / v1.0.0-rc1)
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
              echo "::error::Tag '$REF_NAME' is not a semantic version tag. Expected vMAJOR.MINOR.PATCH, e.g. v0.1.0."
              exit 1
            fi
            echo "Tag $REF_NAME accepted, a GitHub Release will be published."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "Non-tag trigger ($EVENT / $REF_NAME): build and test only, no release will be published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- 编译构建与溯源
  build:
    name: Build & Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Verify tag matches mod_version
        if: needs.validate.outputs.publish == 'true'
        shell: bash
        env:
          TAG_VER: ${{ needs.validate.outputs.version }}
        run: |
          MOD_VER=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r ')
          echo "Comparing Tag Version ($TAG_VER) with gradle.properties mod_version ($MOD_VER)"
          if [ "$TAG_VER" != "$MOD_VER" ]; then
            echo "::error::Tag version ($TAG_VER) does not match gradle.properties mod_version ($MOD_VER)"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -PcleanRuntime -PnoJei: 开发运行时默认带的联调模组（精妙背包、旅行者背包、Curios、Accessories、Sodium、Iris、JEI 的完整模组）
      # 只用于本地 runClient，不进发布 jar；CI 不需要它们，去掉后不必从 CurseMaven / Modrinth 下载，也更稳定（见 build.gradle）。
      - name: Run unit tests
        run: ./gradlew test -PcleanRuntime -PnoJei --info

      - name: Build mod jar
        run: ./gradlew build -PcleanRuntime -PnoJei

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release
          # 拷贝构建出的 jar 文件（排除 sources/javadoc 包）
          find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} release/ \;
          ls -lh release/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: release/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- 发布 Release
  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: artifacts

      - name: List downloaded files
        run: ls -lh artifacts

      - name: Compose release notes
        shell: bash
        env:
          TAG: v${{ needs.validate.outputs.version }}
          VERSION: ${{ needs.validate.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .release
          body=".release/body.md"
          notes=".github/release-notes/${TAG}.md"
          footer=".github/release-notes/_footer.md"

          if [ -f "$notes" ]; then
            cat "$notes" > "$body"
          else
            echo "::warning::No custom release notes found at $notes"
            printf '## MCFloatingBackpack %s\n\n' "$TAG" > "$body"
          fi

          if [ -f "$footer" ]; then
            printf '\n---\n\n' >> "$body"
            sed -e "s|{{version}}|${VERSION}|g" -e "s|{{repository}}|${REPOSITORY}|g" "$footer" >> "$body"
          fi

          cat "$body"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: .release/body.md
          generate_release_notes: true
          append_body: true
          fail_on_unmatched_files: true

