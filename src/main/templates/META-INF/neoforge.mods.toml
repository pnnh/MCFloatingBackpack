modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# Both sides needed once backpack storage syncs over the network.
displayTest="MATCH_VERSION"
description='''
A draggable floating backpack overlay, similar to MMO bag windows.
Toggle with a customizable hotkey; the panel stays above the vanilla inventory
and other container GUIs so items can be moved between them.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Soft-compatible via AbstractContainerScreen; never required to load this mod.
[[dependencies.${mod_id}]]
    modId="sophisticatedcore"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="travelersbackpack"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# 033: Curios (the official 9.x for 1.21.1): the floating backpack can be worn in its back slot. Never required; the compat code in
# compat/curios/ is only used when Curios is loaded.
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[9,)"
    ordering="NONE"
    side="BOTH"

# 034: Accessories (Wisp Forest, a beta for 1.21.1): the floating backpack can be worn in its back slot. Never required; the compat code in
# compat/accessories/ is only used when Accessories is loaded.
[[dependencies.${mod_id}]]
    modId="accessories"
    type="optional"
    versionRange="[1,)"
    ordering="NONE"
    side="BOTH"

# 052: LambDynamicLights (client only): a light item in the backpack's bottom tool area lights its player through it. Never required: without
# it nothing shines (the floating backpack does no lighting of its own). The compat code in compat/lambdynlights/ is only used when it is loaded.
[[dependencies.${mod_id}]]
    modId="lambdynlights"
    type="optional"
    versionRange="[4,)"
    ordering="NONE"
    side="CLIENT"

[modproperties."${mod_id}"."yumi:entrypoints"]
    "lambdynlights:initializer" = "pnnh.mcfloatingbackpack.compat.lambdynlights.BackpackDynamicLight"

# Discovery-only: never required. Dev runClient may include JEI via localRuntime.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"
