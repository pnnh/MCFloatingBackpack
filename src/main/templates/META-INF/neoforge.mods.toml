modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# Both sides needed once backpack storage syncs over the network.
displayTest="MATCH_VERSION"
description='''
A draggable floating backpack overlay, similar to MMO bag windows.
Toggle with a customizable hotkey; the panel stays above the vanilla inventory
and other container GUIs so items can be moved between them.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
    config="${mod_id}.mixins.json"
