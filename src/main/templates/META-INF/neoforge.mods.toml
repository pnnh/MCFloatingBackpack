modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# Both sides needed once backpack storage syncs over the network.
displayTest="MATCH_VERSION"
description='''
A draggable floating backpack overlay, similar to MMO bag windows.
Toggle with a customizable hotkey; the panel stays above the vanilla inventory
and other container GUIs so items can be moved between them.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Soft-compatible via AbstractContainerScreen; never required to load this mod.
[[dependencies.${mod_id}]]
    modId="sophisticatedcore"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="travelersbackpack"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Discovery-only: never required. Dev runClient may include JEI via localRuntime.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
    config="${mod_id}.mixins.json"
