plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        // 033：Curios 的 API jar（只用来编译，见 dependencies 里的 compileOnly）。
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven {
        // 034：Accessories 的 API（只用来编译，见 dependencies 里的 compileOnly）。
        name = "WispForest"
        url = "https://maven.wispforest.io/releases"
        content {
            includeGroup "io.wispforest"
        }
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 039: ./gradlew runClient -Pmcfb.<name>=<value> reaches the game as -Dmcfloatingbackpack.debug.<name>=<value>, the switches for
            // trying the version check out (see VersionDebug); nothing is added when none is given.
            project.properties.each { key, value ->
                if (key.toString().startsWith('mcfb.') && value != null) {
                    systemProperty 'mcfloatingbackpack.debug.' + key.toString().substring('mcfb.'.length()), value.toString()
                }
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// localRuntime is present at dev-run time and is not published as a dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// 开发运行时（runClient / runServer）默认带上所有"别的模组"：精妙背包与旅行者背包（兼容对照）、Curios 与 Accessories（饰品槽，
// 见 docs/plan/worn-backpack-compat.md）、Sodium 与 Iris（光影，仅客户端）、JEI。所有开发世界因此用同一套模组，
// 不会因为模组缺失让物品时好时坏。它们都只在开发运行时有效，不进发布 jar。
//
// 需要干净一点的环境（共用图集度量、帧率对照，见 design/demo/tools/check_atlas_budget.sh）：
//   ./gradlew runClient -PcleanRuntime         只留 JEI
//   ./gradlew runClient -PcleanRuntime -PnoJei 连 JEI 也去掉
// 要完全独立的全新环境，请用真实的游戏启动器手动建一个。
def cleanRuntime = findProperty('cleanRuntime') != null
// Sodium 与 Iris 是客户端模组，放进专用服务器会加载失败；依赖在配置期解析，所以按本次请求的任务名判断（含 server / gametest / data 的任务不带它们）。
// （MDG 的 additionalRuntimeClasspathConfiguration 试过：那样放进去的 jar 不会被当成模组加载。）
def serverOrDataRun = gradle.startParameter.taskNames.any {
    def name = it.toLowerCase()
    name.contains('server') || name.contains('gametest') || name.contains('data')
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // 008: compile-time-only JEI API access for the optional @JeiPlugin in compat/jei/. Not
    // bundled into the published jar and not a runtime dependency — unlike the localRuntime JEI
    // jar below (which is the actual mod, gated behind -PnoJei for dev item browsing), this is
    // unconditional because the plugin class needs mezz.jei.api.* types to compile at all. When
    // JEI itself isn't present at runtime, the annotated class is simply never discovered/loaded.
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.70.0.469"

    // 033: compile-time-only Curios API (the -api jar) for compat/curios/. Not bundled and not a runtime dependency: the real Curios
    // is the localRuntime jar below (dev runs only), and a player's game may or may not have it.
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"

    // 034: compile-time-only Accessories (a beta) for compat/accessories/. transitive = false: its POM would pull owo-lib, forgified
    // fabric-api and the endec libraries, which this mod does not compile against (the dev runs have the real ones as localRuntime below).
    compileOnly("io.wispforest:accessories-neoforge:1.1.0-beta.54+1.21.1") {
        transitive = false
    }

    if (!cleanRuntime) {
        // 004：精妙背包与旅行者背包，用来对照面板的行数、滚动与尺寸；CurseMaven 的 file id 要与各自 mod 要求的 core 版本配套。
        localRuntime "curse.maven:sophisticated-core-618298:9385313"
        localRuntime "curse.maven:sophisticated-backpacks-422301:9385446"
        localRuntime "curse.maven:travelers-backpack-321117:9297032"

        // 规划 docs/plan/worn-backpack-compat.md：Curios（官方 9.x）与 Accessories（必需 owo-lib），看后背槽的行为。
        localRuntime "maven.modrinth:curios:9.5.1+1.21.1"
        localRuntime "maven.modrinth:accessories:1.1.0-beta.54+1.21.1"
        localRuntime "maven.modrinth:owo-lib:0.12.15.6-beta.1+1.21"

        // 010：光影（Iris 1.8.12 声明依赖的正是 Sodium 0.6.13）；光影包放在 run/shaderpacks/，见 design/demo/tools/fetch_shaderpack.sh。
        if (!serverOrDataRun) {
            localRuntime "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
            localRuntime "maven.modrinth:iris:1.8.12+1.21.1-neoforge"
        }
    }

    // JEI for creative/debug item browsing in runClient only (not a published dependency).
    // Disable with: ./gradlew runClient -PnoJei
    // Must stay >= 19.32.0.359: that's the minimum sophisticated-core (above)
    // declares support for; older JEI makes the dev run fail to load mods.
    if (findProperty('noJei') == null) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:19.70.0.469"
    }
}

tasks.named("test") {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
