plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// localRuntime is present at dev-run time and is not published as a dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Dependency resolution happens at configuration time, before any task runs, so "did the user
// ask for a *Compat task" has to be read from the requested task names here rather than from
// task execution. This lets `runClientCompat` / `runServerCompat` behave exactly like
// `runClient` / `runServer -PcompatRuntime` without needing a nested Gradle invocation.
def compatRequested = findProperty('compatRuntime') != null
        || gradle.startParameter.taskNames.any { it.toLowerCase().endsWith('compat') }

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // 008: compile-time-only JEI API access for the optional @JeiPlugin in compat/jei/. Not
    // bundled into the published jar and not a runtime dependency — unlike the localRuntime JEI
    // jar below (which is the actual mod, gated behind -PnoJei for dev item browsing), this is
    // unconditional because the plugin class needs mezz.jei.api.* types to compile at all. When
    // JEI itself isn't present at runtime, the annotated class is simply never discovered/loaded.
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.70.0.469"

    // Optional popular backpack mods for M4 compatibility testing (dev runtime only).
    // Enable with: ./gradlew runClientCompat / runServerCompat (or -PcompatRuntime).
    if (compatRequested) {
        localRuntime "curse.maven:sophisticated-core-618298:9385313"
        localRuntime "curse.maven:sophisticated-backpacks-422301:9385446"
        localRuntime "curse.maven:travelers-backpack-321117:9297032"
    }

    // JEI for creative/debug item browsing in runClient only (not a published dependency).
    // Disable with: ./gradlew runClient -PnoJei
    // Must stay >= 19.32.0.359: that's the minimum sophisticated-core (M4 compatRuntime, above)
    // declares support for; older JEI makes runClientCompat/runServerCompat fail to load mods.
    if (findProperty('noJei') == null) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:19.70.0.469"
    }
}

tasks.register('runClientCompat') {
    group = 'run'
    description = "Runs the client with Sophisticated Backpacks + Traveler's Backpack loaded, for M4 compat testing."
    dependsOn tasks.named('runClient')
}

tasks.register('runServerCompat') {
    group = 'run'
    description = "Runs the dedicated server with Sophisticated Backpacks + Traveler's Backpack loaded, for M4 compat testing."
    dependsOn tasks.named('runServer')
}

tasks.named("test") {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
